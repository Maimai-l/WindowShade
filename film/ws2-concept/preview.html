<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>WindowShade 2 · 概念动画工作样片</title><style>html,body{margin:0;background:#0b0d12}#frame svg{max-width:100vw;height:auto}#controls{position:fixed;bottom:0;left:0;right:0;display:flex;gap:12px;padding:10px;background:#181d28;color:white;font:14px sans-serif}input{flex:1}</style><div id="frame"></div><div id="controls"><button id="play">播放</button><input id="seek" type="range" min="0" max="7559" value="0"><span id="time">0:00</span><label><input id="portrait" type="checkbox">竖版</label></div><script type="module">import{sceneSVG}from'./src/picture.mjs';let playing=false,frame=0,last=0;const el=document.getElementById('frame'),seek=document.getElementById('seek');window.draw=(f,p=false)=>{frame=f;el.innerHTML=sceneSVG(f,{portrait:p});seek.value=f;document.getElementById('time').textContent=(f/60).toFixed(2)+' s';};window.draw(0);seek.oninput=()=>window.draw(Number(seek.value),document.getElementById('portrait').checked);document.getElementById('play').onclick=()=>{playing=!playing;last=performance.now();};function loop(now){if(playing){frame=Math.min(7559,frame+(now-last)*.06);window.draw(frame,document.getElementById('portrait').checked);if(frame>=7559)playing=false;}last=now;requestAnimationFrame(loop);}requestAnimationFrame(loop);</script></html>
