name: deepseek-flash-local
initial: frame

nodes:
  frame:
    prompt: |
      先把可见契约锚定下来，再决定动不动手。把目标、交付物、输出/格式与验收方式、
      明确不许改的东西写进 .statem/task.txt，并列出要读的文件与最终要跑的对照检查命令。

      读一下当前状态入口注入的实践条目；若 preflight 报了危险项，
      在动手前决定保底与回滚方式（复制原始字节 + 记录 sha256）。

      这一状态的产出是契约文件，不是代码。契约没写下来就不要走 solve。
    in_hook:
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/preflight.py --task-file task.txt --out receipts/preflight.json --quiet-empty"
        timeout: 30
        blocking: false
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/practices.py --state frame --preflight receipts/preflight.json"
        timeout: 30
        blocking: false
    before_transfer:
      - type: predicate
        path: task.txt
        exists: true
        non_empty: true
        matches: "(?s).{40,}"
        not_contains: "⟪TODO⟫"
      - type: checklist
        confirmation: none
        items:
          - 可见契约、交付物、验收方式已写入 .statem/task.txt
          - 要读的文件与最终对照检查命令已明确（不是先动手再补）
          - preflight 危险项已读；若有，保底与回滚方式已确定并记录

  solve:
    prompt: |
      正常解题：按契约产出交付物（代码改动、文件、服务状态、结论）。

      保持改动范围与契约一致；在离开本状态之前把 progress.md 更新成可恢复的形态：
      契约摘要、交付物身份、试过的命令、跑过的检查与结果、残余风险、下一步。

      证据要在承诺给下游的接口上取（真实命令/真实客户端往返），
      不能只用"文件存在""端口开着"这类前置条件代替通过。

      如果遇到外部阻塞（缺凭据、缺权限、需要人工审批），写 .statem/blocked.json
      并直接走 handoff，不要空转重试。
    in_hook:
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/practices.py --state solve --preflight receipts/preflight.json"
        timeout: 30
        blocking: false
    before_transfer:
      - type: predicate
        path: progress.md
        exists: true
        non_empty: true
        not_contains: "⟪TODO⟫"
      - type: checklist
        confirmation: none
        items:
          - 交付物/服务/结论已存在，或已写 .statem/blocked.json 说明具体阻塞
          - progress.md 记录了交付物身份、跑过的对照检查与当前结果、残余风险
          - 没有改动与契约无关的文件
          - 破坏性操作前已保底（复制原始字节 + sha256，路径已记录）
    out_hook:
      type: message
      text: "离开 solve 前更新 progress.md：交付物身份、检查命令与结果、残余风险、下一步。"

  contract_check:
    prompt: |
      拿候选交付物对照可见契约（.statem/task.txt）。这一步不加载可选的大型检查，
      只回答"可见契约是否被满足"。

      写 .statem/receipts/contract.json：artifact（交付物身份）、status
      （passed / failed / residual_risk）、checks（跑过的命令与结果）、
      reused_checks、remaining_risk、next_action（repair / self_review / handoff）。

      对照检查必须走消费者接口。失败就写 failed 并转 repair，不要在这里改实现。
    in_hook:
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/receipt.py ensure --kind contract --out receipts/contract.json"
        timeout: 20
        blocking: false
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/practices.py --state contract_check --preflight receipts/preflight.json"
        timeout: 30
        blocking: false
    before_transfer:
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/receipt.py check --kind contract --file receipts/contract.json"
        timeout: 30
      - type: predicate
        path: receipts/contract.json
        json_path: status
        one_of:
          - passed
          - failed
          - residual_risk
      - type: checklist
        confirmation: none
        items:
          - 对照检查是通过真实消费者接口跑的，命令与结果已写进回执
          - 失败项是具体的可修复问题，而不是"大致不对"
          - status 与 next_action 一致（failed 时 next_action 为 repair）

  self_review:
    prompt: |
      做一次有界自审，只看三个镜片，每个镜片都要引用当前文件或回执里的具体证据：
      task_contract、evidence_freshness、edge_risk。

      写 .statem/receipts/self-review.json：status（clean / issues / residual_risk）、
      issues_found（true/false）、needs_evidence（true/false）、lenses、findings。

      这里不做重活、不改交付物、不扩展范围。格式正确、能加载、能导入都不是语义正确的证明；
      图片/视频/几何/科学计算类任务如果拿不到真实运行或视觉证据，就写 residual_risk，
      不要用结构检查冒充语义通过。
    in_hook:
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/receipt.py ensure --kind self_review --out receipts/self-review.json"
        timeout: 20
        blocking: false
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/practices.py --state self_review --preflight receipts/preflight.json"
        timeout: 30
        blocking: false
    before_transfer:
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/receipt.py check --kind self_review --file receipts/self-review.json"
        timeout: 30
      - type: predicate
        path: receipts/self-review.json
        json_path: status
        one_of:
          - clean
          - issues
          - residual_risk
      - type: checklist
        confirmation: none
        items:
          - 三个镜片都引用了当前产物或回执里的具体证据
          - 发现的问题已写进 findings，或明确记录为残余风险
          - 自审期间没有改交付物、没有做重活

  evidence_check:
    prompt: |
      只执行被选中的聚焦证据，不扩展成大规模检查。

      写 .statem/receipts/evidence.json，逐条记录：检查名、命令、工作目录、退出码、
      关键输出、产物身份（哈希或版本）、是否复用。回执必须证明证据属于当前产物：
      产物变过就重跑。会改状态（服务、端口、数据库、git 引用）的检查必须在这里做掉，
      不能留到交接瞬间第一次跑。

      证据失败就转 repair；通过就转 handoff。自写的 verifier 计划不算证据，
      它的命令真的跑过并留下输出才算。
    in_hook:
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/receipt.py ensure --kind evidence --out receipts/evidence.json"
        timeout: 20
        blocking: false
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/practices.py --state evidence_check --preflight receipts/preflight.json"
        timeout: 30
        blocking: false
    before_transfer:
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/receipt.py check --kind evidence --file receipts/evidence.json"
        timeout: 30
      - type: checklist
        confirmation: none
        items:
          - 每条证据都有命令、退出码与关键输出，且属于当前产物
          - 失败的证据已经修复，或记录为阻塞性残余风险
          - 状态性检查已在此状态执行完毕，没有留给交接

  repair:
    prompt: |
      针对失败项做最小的具体修复，不要顺手重写整个交付物。

      判断失败类型：瞬态（网络、限流、临时锁）才值得带次数上限重试；
      契约不满足、校验失败、逻辑错误属于确定性失败，重试无用，必须改实现。
      同一个命令连续两次同样失败，停止重试，改去定位原因。

      修完回到 contract_check 重新对照可见契约；如果已经无法在剩余预算内推进，
      写 .statem/blocked.json 并转 handoff。
    in_hook:
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/practices.py --state repair --preflight receipts/preflight.json"
        timeout: 30
        blocking: false
    before_transfer:
      - type: predicate
        path: progress.md
        exists: true
        non_empty: true
      - type: checklist
        confirmation: none
        items:
          - 失败原因已定位或缩小到具体位置
          - 已做具体修复，或已记录带原因的阻塞
          - 下一步是对照检查还是交接，已写清楚

  session_refresh:
    prompt: |
      只在还会继续下一轮循环、且上下文里堆积了大量已作废尝试时使用。
      先确认 progress.md、.statem/task.txt 与 statem history 已经包含压缩后需要的长期事实，
      再用 `statem compact-prompt` 生成安全的压缩指令，压缩后立刻用 cur / history 恢复注意力。

      不要在上下文还干净的时候压缩；也不要用 /clear 当作正常循环的一部分。
    before_transfer:
      type: checklist
      confirmation: none
      items:
        - progress.md、task.txt 与 statem history 已包含压缩后需要的长期事实
        - 已完成一次安全压缩，或明确判断上下文足够干净无需压缩
        - 压缩后重新确认过当前状态与下一步转移

  handoff:
    prompt: |
      交付。读 progress.md 与 .statem/receipts/ 里的回执，然后简短说明：
      改了什么、用什么证据验证的、当前状态、已知风险、建议的下一步。

      如果停在阻塞态，说明缺什么、由谁解决、解掉之后从哪个状态继续。
      不要为了显得完成而编造结论；暂停态如实标注。
    in_hook:
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/practices.py --state handoff --preflight receipts/preflight.json"
        timeout: 30
        blocking: false
    before_transfer:
      type: checklist
      confirmation: none
      items:
        - 交付物身份、验证证据与残余风险都来自回执，而不是回忆
        - 阻塞（如有）已写入 .statem/blocked.json

edges:
  - from: frame
    to: solve
    condition:
      - type: message
        text: "契约已写入 task.txt，危险项已评估。"

  - from: frame
    to: handoff
    condition:
      - type: predicate
        path: blocked.json
        exists: true
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/receipt.py check --kind blocked --file blocked.json"
        timeout: 20

  - from: solve
    to: contract_check
    condition:
      - type: message
        text: "已有候选交付物，需要对照可见契约。"

  - from: solve
    to: handoff
    condition:
      - type: predicate
        path: blocked.json
        exists: true
        non_empty: true
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/receipt.py check --kind blocked --file blocked.json"
        timeout: 20

  - from: contract_check
    to: repair
    condition:
      - type: predicate
        path: receipts/contract.json
        json_path: status
        equals: failed

  - from: contract_check
    to: self_review
    condition:
      - type: message
        text: "可见契约通过或有记录的残余风险，做一次有界自审。"

  - from: contract_check
    to: handoff
    condition:
      - type: predicate
        path: blocked.json
        exists: true
        non_empty: true
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/receipt.py check --kind blocked --file blocked.json"
        timeout: 20

  - from: self_review
    to: repair
    condition:
      - type: predicate
        path: receipts/self-review.json
        json_path: issues_found
        equals: true

  - from: self_review
    to: evidence_check
    condition:
      - type: predicate
        path: receipts/self-review.json
        json_path: needs_evidence
        equals: true

  - from: self_review
    to: handoff
    condition:
      - type: predicate
        path: receipts/self-review.json
        json_path: needs_evidence
        equals: false

  - from: self_review
    to: session_refresh
    condition:
      - type: message
        text: "自审通过且还要继续下一轮，上下文已经变脏。"

  - from: evidence_check
    to: handoff
    condition:
      - type: message
        text: "聚焦证据通过，且证据属于当前产物。"

  - from: evidence_check
    to: repair
    condition:
      - type: message
        text: "聚焦证据失败或暴露了具体可修复问题。"

  - from: repair
    to: contract_check
    condition:
      - type: message
        text: "修复已应用，需要重新对照可见契约。"

  - from: repair
    to: handoff
    condition:
      - type: predicate
        path: blocked.json
        exists: true
        non_empty: true
      - type: command
        run: "/opt/homebrew/opt/python@3.14/bin/python3.14 /Users/aaron/.codex/statem/bin/receipt.py check --kind blocked --file blocked.json"
        timeout: 20

  - from: session_refresh
    to: frame
    condition:
      - type: message
        text: "上下文已压缩或判断无需压缩，状态已恢复。"
