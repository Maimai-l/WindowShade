name: Apple zh strings

# 从 CI 的 Mac 上取出系统自带 App 和“系统设置”各页的简体中文界面文字，供 docs/copy-guide.md 对照。只在手动触发时运行。
on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Collect the strings
        run: |
          sw_vers
          python3 .github/scripts/apple-zh-strings.py "$RUNNER_TEMP/apple-zh-strings.tsv"
          gzip -9 "$RUNNER_TEMP/apple-zh-strings.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: apple-zh-strings
          path: ${{ runner.temp }}/apple-zh-strings.tsv.gz
