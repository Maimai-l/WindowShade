name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build.sh --check
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: .github/scripts/select-xcode.sh
      - name: Compile app
        run: prototype/build.sh --check

  tests:
    name: Test runners
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: .github/scripts/select-xcode.sh
      - name: Install ripgrep
        run: brew install ripgrep
      - name: Run every tests/run-*.sh
        run: .github/scripts/run-tests.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: .build/ci-logs
